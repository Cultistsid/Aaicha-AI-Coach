name: Devin AI Analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly deep scan at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  devin-quick-scan:
    name: Quick Analysis (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Devin CLI
        run: |
          curl -fsSL https://cli.devin.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci

      - name: Run Devin Quick Analysis
        run: |
          devin analyze --quick --format json > devin-analysis.json || true
          cat devin-analysis.json

      - name: Check for Critical Issues
        run: |
          CRITICAL=$(jq -r '.issues[] | select(.severity == "critical")' devin-analysis.json | wc -l)
          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Found $CRITICAL critical issues"
            jq -r '.issues[] | select(.severity == "critical")' devin-analysis.json
            exit 1
          fi
          echo "✅ No critical issues found"

      - name: Upload Analysis Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devin-quick-scan
          path: devin-analysis.json

  devin-security-audit:
    name: Security Audit (Main Branch)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Devin CLI
        run: |
          curl -fsSL https://cli.devin.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci

      - name: Security Scan
        run: |
          devin security-scan --format json > devin-security.json || true
          cat devin-security.json

      - name: Check API Key Leaks
        run: |
          if grep -r "sk-ant-\|ANTHROPIC_API_KEY.*=.*sk" --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "❌ SECURITY ALERT: Potential API key leak detected!"
            exit 1
          fi
          echo "✅ No API key leaks detected"

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devin-security-audit
          path: devin-security.json

  devin-deep-scan:
    name: Deep Analysis (Nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Devin CLI
        run: |
          curl -fsSL https://cli.devin.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci

      - name: Full Codebase Analysis
        run: |
          devin analyze --deep --format json > devin-deep.json || true

      - name: Performance Profiling
        run: |
          devin perf-profile --duration 60 --format json > devin-perf.json || true

      - name: Generate Metrics Report
        run: |
          devin metrics --format markdown > DEVIN_METRICS.md || true

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devin-nightly-reports
          path: |
            devin-deep.json
            devin-perf.json
            DEVIN_METRICS.md
